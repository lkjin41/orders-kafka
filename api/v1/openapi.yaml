openapi: 3.0.3
info:
  title: Orders API
  version: "1.0.0"
servers:
  - url: /
paths:
  /orders:
    post:
      summary: Create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
  /orders/{id}:
    get:
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Internal error
          content:
            text/plain:
              schema:
                type: string
  /orders/{id}/pay:
    post:
      summary: Mark order as paid
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: Invalid transition
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
  /orders/{id}/ship:
    post:
      summary: Mark order as shipped
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: Invalid transition
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
  /orders/{id}/cancel:
    post:
      summary: Cancel order
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: Invalid transition
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            text/plain:
              schema:
                type: string

components:
  parameters:
    OrderID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [customer_id, total_amount]
      properties:
        customer_id:
          type: string
          minLength: 1
        total_amount:
          type: integer
          format: int64
          minimum: 0

    Order:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
          format: int64
        customer_id:
          type: string
        total_amount:
          type: integer
          format: int64
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
